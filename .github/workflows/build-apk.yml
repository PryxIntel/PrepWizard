name: Build PrepWizard Android APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'frontend/public/PrepWizard.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend Web Assets
        working-directory: frontend
        run: npm run build

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android Project
        working-directory: frontend
        run: npx cap sync android

      - name: Build Android Debug APK with Gradle
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK File
        run: |
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk PrepWizard.apk

      - name: Commit APK to repository for direct website hosting
        run: |
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk frontend/public/PrepWizard.apk
          git config --global user.name "Pryxintel"
          git config --global user.email "priyanshu0.dotin@gmail.com"
          git add frontend/public/PrepWizard.apk
          git commit -m "add compiled android apk to frontend public downloads" || echo "No changes to commit"
          git push origin main

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrepWizard-debug-apk
          path: PrepWizard.apk
          retention-days: 30

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v1.0.0
          name: "PrepWizard Android App v1.0.0"
          body: |
            ## 📱 PrepWizard CBT Exam Mobile App (Android APK)
            Official Android APK build for PrepWizard CBT Exam Platform.

            ### Quick Download & Install:
            1. Tap **`PrepWizard.apk`** below to download directly to your Android device.
            2. Open the downloaded file and tap **Install**.
            3. If prompted, toggle "Allow from this source" in Android security settings.
          files: PrepWizard.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
